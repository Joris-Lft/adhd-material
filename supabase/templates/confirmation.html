<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f6f6f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2937">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <h1 style="font-size:20px;margin:0 0 16px">Bienvenue sur adhd-material</h1>
      <p style="margin:0 0 8px">Ton code de connexion :</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 24px">{{ .Token }}</p>
      <p style="margin:0 0 16px">Tape ce code dans l'application, ou clique sur le bouton :</p>
      <p style="margin:0 0 24px">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email"
           style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600">Me connecter</a>
      </p>
      <p style="font-size:13px;color:#6b7280;margin:0">Le code et le lien sont valables 1 heure. Si tu n'as rien demandé, ignore simplement cet email.</p>
    </div>
  </body>
</html>
